<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:sans-serif;background:#111;color:#eee;padding:20px}
input{width:100%;padding:12px;background:#222;border:2px solid #444;color:#eee;border-radius:10px;font-size:15px;margin-bottom:16px;box-sizing:border-box}
input:focus{border-color:#00e5a0;outline:none}
button{width:100%;padding:16px;background:#00e5a0;border:none;border-radius:10px;font-size:17px;font-weight:700;color:#000;cursor:pointer}
#msg{margin-top:16px;padding:14px;border-radius:10px;font-size:14px;display:none}
</style>
</head>
<body>
<h2 style="color:#00e5a0;margin-bottom:16px">Deploy financa.ia</h2>
<input type="password" id="tk" placeholder="Token GitHub (ghp_...)">
<button id="btn">Atualizar app</button>
<div id="msg"></div>
<script>
var R="alinesilveiraanalista-commits/financas-ia";
var BASE="https://alinesilveiraanalista-commits.github.io/financas-ia/";

function show(txt, ok){
  var m=document.getElementById("msg");
  m.style.display="block";
  m.style.cssText="display:block;padding:14px;border-radius:10px;font-size:14px;"+(ok?"background:rgba(0,229,160,0.15);border:1px solid #00e5a0;color:#00e5a0":"background:rgba(255,77,109,0.15);border:1px solid #ff4d6d;color:#ff4d6d");
  m.textContent=txt;
}

document.getElementById("btn").addEventListener("click",function(){
  var t=document.getElementById("tk").value.trim();
  if(!t){show("Cole o token!",false);return;}
  show("Baixando partes do app (1/5)...",true);
  
  var parts=["app-1.b64","app-2.b64","app-3.b64","app-4.b64","app-5.b64"];
  var fetches=parts.map(function(p,i){
    return fetch(BASE+p+"?t="+Date.now()).then(function(r){
      show("Baixando partes ("+(i+2)+"/5)...",true);
      return r.text();
    });
  });
  
  Promise.all(fetches).then(function(chunks){
    show("Montando arquivo...",true);
    var b64=chunks.map(function(c){return c.replace(/
/g,"").trim();}).join("");
    
    show("Conectando ao GitHub...",true);
    return fetch("https://api.github.com/repos/"+R+"/contents/index.html",{
      headers:{"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json"}
    }).then(function(r){return r.json()}).then(function(d){
      if(!d.sha){show("Token invalido!",false);return;}
      show("Enviando para GitHub...",true);
      return fetch("https://api.github.com/repos/"+R+"/contents/index.html",{
        method:"PUT",
        headers:{"Authorization":"Bearer "+t,"Content-Type":"application/json"},
        body:JSON.stringify({message:"update app",content:b64,sha:d.sha})
      }).then(function(r){return r.json()}).then(function(d){
        if(d.commit){show("Atualizado! Aguarde 2 min e abra o app.",true);}
        else{show("Erro: "+(d.message||JSON.stringify(d)),false);}
      });
    });
  }).catch(function(e){show("Erro: "+e.message,false);});
});
</script>
</body>
</html>
